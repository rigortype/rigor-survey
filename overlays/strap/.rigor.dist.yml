# .rigor.dist.yml — Rigor configuration (committed; shared).
# Generated by the rigor-project-init workflow (survey typing-hole sweep).

# .ruby-version pins 4.0.6.
target_ruby: "4.0"

paths:
  - app

exclude:
  - vendor
  - tmp

# Rails 8 app (Gemfile: rails >= 8) — controllers/helpers only, no app/models.
plugins:
  - rigor-actionpack
  - rigor-activerecord
  - rigor-actionmailer
  - rigor-rails-routes
  - rigor-rails-i18n
  - rigor-activesupport-core-ext
  # sorbet-runtime dependency + sorbet/rbi tree.
  - rigor-sorbet

severity_profile: lenient
